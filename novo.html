<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo usuario | Estacionamento</title>
  </head>
  <body class="min-h-screen bg-blue-100 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-blue-200 p-8 rounded-xl shadow-lg">
      <h1 class="text-2xl font-bold text-slate-800">Novo usuario</h1>
      <p class="text-slate-500">Crie sua conta para acessar o sistema</p>

      <form id="cadastro-form" class="mt-6">
        <label class="block text-sm font-medium text-slate-700 my-3">E-mail</label>
        <input
          type="email"
          id="email"
          required
          autofocus
          class="w-full border border-slate-500 rounded-md p-2"
        />

        <label class="block text-sm font-medium text-slate-700 my-3">Senha</label>
        <input
          type="password"
          id="password"
          required
          minlength="6"
          class="w-full border border-slate-500 rounded-md p-2"
        />

        <label class="block text-sm font-medium text-slate-700 my-3">Confirmar senha</label>
        <input
          type="password"
          id="confirmar-password"
          required
          minlength="6"
          class="w-full border border-slate-500 rounded-md p-2"
        />

        <button
          id="cadastrar"
          type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-md mt-4 hover:bg-orange-600 disabled:cursor-not-allowed disabled:opacity-70"
        >
          Cadastrar usuario
        </button>
      </form>

      <div id="message" class="mt-4 text-center text-sm p-4 rounded-xl hidden"></div>

      <p class="mt-6 text-center text-sm text-slate-700">
        Ja tem uma conta?
        <a href="./index.html" class="font-semibold text-blue-600">Voltar ao login</a>
      </p>
    </div>

    <script type="module" src="/src/novo.js"></script>
  </body>
</html>
